name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    name: Server engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  client:
    name: Godot client smoke test
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.6-stable
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot
          chmod +x godot
      - name: Import project
        run: ./godot --headless --path client --import
      - name: Smoke test
        run: ./godot --headless --path client --script res://tests/smoke.gd
